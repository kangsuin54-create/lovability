<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>러빌리티 — Lovability</title>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw; height: 100vh;
      overflow: hidden;
      font-family: 'Nanum Gothic', sans-serif;
      cursor: pointer;
      user-select: none;
    }

    /* ── ALL SCREENS ── */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .screen.off { display: none; }

    /* ════════════════════════════════
       SCREEN 1 · MARIO INTRO
    ════════════════════════════════ */
    #s-mario {
      background: #5C94FC;
      overflow: hidden;
    }

    /* Sky clouds */
    .cloud {
      position: absolute;
      background: white;
      border-radius: 40px;
      pointer-events: none;
    }
    .cloud::before, .cloud::after {
      content: ''; position: absolute;
      background: white; border-radius: 50%;
    }
    .cl1 { width: 110px; height: 36px; top: 15%; left: 8%;  animation: cdrift 9s ease-in-out infinite; }
    .cl1::before { width: 50px; height: 50px; top: -22px; left: 12px; }
    .cl1::after  { width: 38px; height: 38px; top: -16px; left: 50px; }
    .cl2 { width: 140px; height: 44px; top: 10%; left: 45%; animation: cdrift 12s ease-in-out infinite reverse; }
    .cl2::before { width: 62px; height: 62px; top: -28px; left: 18px; }
    .cl2::after  { width: 48px; height: 48px; top: -22px; left: 68px; }
    .cl3 { width: 90px;  height: 28px; top: 22%; right: 10%; animation: cdrift 10s ease-in-out infinite; }
    .cl3::before { width: 40px; height: 40px; top: -18px; left: 10px; }
    .cl3::after  { width: 32px; height: 32px; top: -14px; left: 40px; }
    @keyframes cdrift {
      0%, 100% { transform: translateX(0); }
      50%       { transform: translateX(16px); }
    }

    /* Mario title */
    .mario-title {
      position: absolute;
      top: 36px; left: 50%;
      transform: translateX(-50%);
      font-family: 'Black Han Sans', sans-serif;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      color: white;
      text-shadow: 3px 3px 0 rgba(0,0,0,0.25);
      white-space: nowrap;
      pointer-events: none;
    }
    .mario-title .tl { color: #FFD54F; }

    /* Hit counter */
    .hit-ctr {
      position: absolute;
      top: 28px; right: 28px;
      background: rgba(0,0,0,0.55);
      color: white;
      font-weight: 800;
      font-size: 1.15rem;
      padding: 7px 16px;
      border-radius: 20px;
      pointer-events: none;
    }

    /* Brick */
    #brick-wrap {
      position: absolute;
      bottom: 268px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }
    #brick-svg { display: block; image-rendering: pixelated; }
    .brick-bump { animation: brickBump 0.2s ease-out; }
    @keyframes brickBump {
      0%, 100% { transform: translateY(0); }
      45%       { transform: translateY(-10px); }
    }

    /* Heart pop */
    .heart-pop {
      position: absolute;
      font-size: 2rem;
      pointer-events: none;
      animation: heartFly 0.9s ease-out forwards;
      left: 50%; transform: translateX(-50%);
      top: -10px;
      z-index: 20;
    }
    @keyframes heartFly {
      0%   { transform: translateX(-50%) translateY(0) scale(0.4); opacity: 1; }
      30%  { opacity: 1; }
      100% { transform: translateX(-50%) translateY(-110px) scale(1.6); opacity: 0; }
    }

    /* Mario character */
    #mario-char {
      position: absolute;
      bottom: 80px;
      left: calc(50% - 32px);
      pointer-events: none;
    }
    #mario-svg { display: block; image-rendering: pixelated; }
    .mario-jump { animation: marioJump 0.42s cubic-bezier(0.4,0,0.6,1); }
    @keyframes marioJump {
      0%, 100% { transform: translateY(0); }
      42%, 58% { transform: translateY(-120px); }
    }

    /* Ground */
    .mario-ground {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 80px;
      background: linear-gradient(180deg, #52A024 0%, #6BC42A 22%, #8B6914 22%, #A07830 100%);
      pointer-events: none;
    }
    .mario-ground::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 22px;
      background: repeating-linear-gradient(90deg,
        transparent 0px, transparent 32px,
        rgba(0,0,0,0.12) 32px, rgba(0,0,0,0.12) 34px
      );
    }

    /* Click hint */
    .click-hint {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.5);
      color: white;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 7px 20px;
      border-radius: 20px;
      pointer-events: none;
      animation: blink 1.6s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.45} }

    /* ════════════════════════════════
       SCREENS 2–4 · STORY
    ════════════════════════════════ */
    .story-screen {
      background: linear-gradient(180deg, #1a2a44 0%, #293d5c 55%, #1e2d44 100%);
      overflow: hidden;
    }

    .story-rain {
      position: absolute; inset: 0;
      pointer-events: none; overflow: hidden;
    }

    .story-text {
      font-family: 'Black Han Sans', sans-serif;
      font-size: clamp(1.6rem, 5.5vw, 3.2rem);
      color: white;
      text-align: center;
      line-height: 1.45;
      padding: 0 40px;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.35);
      animation: fadeUp 0.5s ease forwards;
      position: relative;
      z-index: 2;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Ground silhouette for story */
    .story-ground {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 90px;
      background: #0d1a0d;
      pointer-events: none;
    }
    .story-ground::before {
      content: '';
      position: absolute;
      top: -30px; left: 0; right: 0; height: 32px;
      background: #0d1a0d;
      clip-path: polygon(0% 100%, 4% 0%, 8% 80%, 12% 20%, 16% 60%, 20% 0%, 25% 70%, 30% 10%, 35% 80%, 40% 0%, 45% 65%, 50% 5%, 55% 75%, 60% 15%, 65% 55%, 70% 0%, 75% 80%, 80% 10%, 85% 70%, 90% 0%, 95% 65%, 100% 20%, 100% 100%);
    }

    .story-click-hint {
      position: absolute; bottom: 26px;
      color: rgba(255,255,255,0.42);
      font-size: 0.82rem;
      animation: blink 1.6s ease-in-out infinite;
      z-index: 2;
    }

    /* Rain drops (shared style via JS) */
    @keyframes rainFall {
      from { top: -30px; }
      to   { top: 110%; }
    }

    /* ════════════════════════════════
       SCREEN 5 · CHOICE
    ════════════════════════════════ */
    #s-choice {
      background: linear-gradient(135deg, #FFF9F0 0%, #FFF0F9 100%);
      cursor: default;
    }

    .choice-title {
      font-family: 'Black Han Sans', sans-serif;
      font-size: clamp(1.1rem, 3vw, 1.7rem);
      color: #2D2D2D;
      margin-bottom: 44px;
      text-align: center;
      animation: fadeUp 0.5s ease forwards;
    }

    .choice-row {
      display: flex; gap: 22px;
      flex-wrap: wrap; justify-content: center;
      animation: fadeUp 0.5s ease 0.15s both;
    }

    .c-btn {
      padding: 22px 42px;
      font-family: 'Black Han Sans', sans-serif;
      font-size: clamp(0.95rem, 2.5vw, 1.4rem);
      border: 4px solid #2D2D2D;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 6px 6px 0 #2D2D2D;
      transition: transform 0.12s, box-shadow 0.12s;
      background: white;
    }
    .c-btn:hover  { transform: translate(-2px,-2px); box-shadow: 8px 8px 0 #2D2D2D; }
    .c-btn:active { transform: translate(2px,2px);   box-shadow: 3px 3px 0 #2D2D2D; }
    .c-btn-a { background: #4FC3F7; color: white; }
    .c-btn-b { background: #FF6B9D; color: white; }

    /* ════════════════════════════════
       SCREENS 6–7 · SCENES A & B
    ════════════════════════════════ */
    .scene-screen {
      background: linear-gradient(180deg, #1e2d44 0%, #2a3d5c 45%, #344d6e 100%);
      overflow: hidden;
    }

    .scene-rain {
      position: absolute; inset: 0;
      pointer-events: none; overflow: hidden;
    }

    .scene-ground {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 110px; background: #0a140a;
      pointer-events: none;
    }
    .scene-ground::before {
      content: '';
      position: absolute;
      top: -40px; left: 0; right: 0; height: 42px;
      background: #0a140a;
      clip-path: polygon(0% 100%, 3% 10%, 6% 70%, 9% 0%, 13% 60%, 17% 5%, 21% 80%, 25% 20%, 29% 65%, 33% 0%, 37% 75%, 41% 15%, 45% 50%, 49% 0%, 53% 80%, 57% 10%, 61% 60%, 65% 5%, 69% 75%, 73% 0%, 77% 65%, 81% 20%, 85% 80%, 89% 0%, 93% 55%, 97% 30%, 100% 70%, 100% 100%);
    }

    .scene-label {
      position: absolute;
      top: 28px; left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.14);
      color: white;
      font-family: 'Black Han Sans', sans-serif;
      font-size: 1.05rem;
      padding: 7px 22px;
      border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.28);
      pointer-events: none;
      z-index: 10;
    }

    .scene-back-hint {
      position: absolute; bottom: 120px;
      color: rgba(255,255,255,0.38);
      font-size: 0.82rem;
      animation: blink 1.6s ease-in-out infinite;
      z-index: 10;
      pointer-events: none;
    }

    /* Puddle shimmer */
    .puddle {
      position: absolute;
      bottom: 108px;
      border-radius: 50%;
      background: rgba(100,160,220,0.25);
      animation: puddleShimmer 2s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes puddleShimmer {
      0%,100% { opacity: 0.25; }
      50%      { opacity: 0.45; }
    }

    /* Thunder flash */
    .thunder {
      position: absolute; inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
    }
    .thunder.flash {
      animation: thunderFlash 0.3s ease-out forwards;
    }
    @keyframes thunderFlash {
      0%  { opacity: 0.35; }
      100%{ opacity: 0; }
    }

    /* Transition overlay */
    #transition {
      position: fixed; inset: 0;
      background: black;
      opacity: 0;
      pointer-events: none;
      z-index: 999;
      transition: opacity 0.35s ease;
    }
    #transition.fade-in  { opacity: 1; }
    #transition.fade-out { opacity: 0; }
  </style>
</head>
<body>

<!-- ══ TRANSITION OVERLAY ══ -->
<div id="transition"></div>

<!-- ══════════════════════════════════
     SCREEN 1 · MARIO INTRO
══════════════════════════════════ -->
<div id="s-mario" class="screen">
  <div class="cloud cl1"></div>
  <div class="cloud cl2"></div>
  <div class="cloud cl3"></div>

  <div class="mario-title">
    <span class="tl">~</span>김종국 사랑스러워<span class="tl">~</span>
  </div>

  <div class="hit-ctr" id="hit-ctr">💗 0 / 3</div>

  <!-- Brick block -->
  <div id="brick-wrap">
    <svg id="brick-svg" width="72" height="72" viewBox="0 0 16 16">
      <rect width="16" height="16" fill="#C84B0F"/>
      <rect x="0" y="7" width="16" height="2" fill="#8B2E00"/>
      <rect x="7" y="0" width="2" height="7" fill="#8B2E00"/>
      <rect x="3" y="9" width="2" height="7" fill="#8B2E00"/>
      <rect x="11" y="9" width="2" height="7" fill="#8B2E00"/>
      <rect x="1" y="1" width="4" height="1" fill="#E06820"/>
      <rect x="9" y="1" width="5" height="1" fill="#E06820"/>
      <rect x="1" y="10" width="1" height="1" fill="#E06820"/>
      <rect x="4" y="10" width="5" height="1" fill="#E06820"/>
      <rect x="12" y="10" width="3" height="1" fill="#E06820"/>
    </svg>
  </div>

  <!-- Mario character -->
  <div id="mario-char">
    <svg id="mario-svg" width="72" height="90" viewBox="0 0 16 20">
      <!-- Hat -->
      <rect x="3" y="0" width="8" height="1" fill="#CC0000"/>
      <rect x="1" y="1" width="11" height="2" fill="#CC0000"/>
      <!-- Hair -->
      <rect x="1" y="3" width="5" height="1" fill="#5C3100"/>
      <rect x="6" y="3" width="4" height="1" fill="#CC0000"/>
      <!-- Face -->
      <rect x="1" y="4" width="12" height="3" fill="#FFCBA4"/>
      <!-- Eye -->
      <rect x="5" y="5" width="2" height="1" fill="#000"/>
      <!-- Nose -->
      <rect x="7" y="6" width="3" height="1" fill="#FFCBA4"/>
      <!-- Mustache -->
      <rect x="2" y="7" width="3" height="1" fill="#5C3100"/>
      <rect x="6" y="7" width="5" height="1" fill="#5C3100"/>
      <!-- Shirt -->
      <rect x="3" y="8" width="10" height="1" fill="#CC0000"/>
      <!-- Overalls bib -->
      <rect x="2" y="9" width="12" height="4" fill="#0000BB"/>
      <rect x="4" y="9" width="8" height="3" fill="#CC0000"/>
      <!-- Overall straps -->
      <rect x="4" y="8" width="2" height="1" fill="#0000BB"/>
      <rect x="10" y="8" width="2" height="1" fill="#0000BB"/>
      <!-- Buttons -->
      <rect x="5" y="10" width="1" height="1" fill="#FFCBA4"/>
      <rect x="10" y="10" width="1" height="1" fill="#FFCBA4"/>
      <!-- Arms -->
      <rect x="0" y="9" width="2" height="4" fill="#FFCBA4"/>
      <rect x="14" y="9" width="2" height="4" fill="#FFCBA4"/>
      <!-- Hands -->
      <rect x="0" y="13" width="2" height="1" fill="#CC0000"/>
      <rect x="14" y="13" width="2" height="1" fill="#CC0000"/>
      <!-- Legs -->
      <rect x="2" y="13" width="5" height="3" fill="#CC0000"/>
      <rect x="9" y="13" width="5" height="3" fill="#CC0000"/>
      <!-- Shoes -->
      <rect x="1" y="16" width="6" height="2" fill="#5C3100"/>
      <rect x="8" y="16" width="7" height="2" fill="#5C3100"/>
      <rect x="0" y="17" width="2" height="1" fill="#5C3100"/>
      <rect x="14" y="17" width="2" height="1" fill="#5C3100"/>
    </svg>
  </div>

  <div class="mario-ground"></div>
  <div class="click-hint">화면을 클릭하세요! (3번)</div>
</div>

<!-- ══════════════════════════════════
     SCREEN 2 · STORY 1
══════════════════════════════════ -->
<div id="s-story1" class="screen story-screen off">
  <div class="story-rain" id="rain-s1"></div>
  <div class="story-ground"></div>
  <p class="story-text">연인과 여행을 떠난 날,<br>폭우가 내린다.</p>
  <div class="story-click-hint">클릭하여 계속</div>
</div>

<!-- ══════════════════════════════════
     SCREEN 3 · STORY 2
══════════════════════════════════ -->
<div id="s-story2" class="screen story-screen off">
  <div class="story-rain" id="rain-s2"></div>
  <div class="story-ground"></div>
  <p class="story-text">헉!<br>가기로 했던 맛집이 닫았다!</p>
  <div class="story-click-hint">클릭하여 계속</div>
</div>

<!-- ══════════════════════════════════
     SCREEN 4 · STORY 3
══════════════════════════════════ -->
<div id="s-story3" class="screen story-screen off">
  <div class="story-rain" id="rain-s3"></div>
  <div class="story-ground"></div>
  <p class="story-text">큰일이다...</p>
  <div class="story-click-hint">클릭하여 계속</div>
</div>

<!-- ══════════════════════════════════
     SCREEN 5 · CHOICE
══════════════════════════════════ -->
<div id="s-choice" class="screen off">
  <p class="choice-title">어떤 상황이 펼쳐질까요?</p>
  <div class="choice-row">
    <button class="c-btn c-btn-a" id="btn-a">💙 A상황 보러가기</button>
    <button class="c-btn c-btn-b" id="btn-b">💗 B상황 보러가기</button>
  </div>
</div>

<!-- ══════════════════════════════════
     SCREEN 6 · SCENE A
══════════════════════════════════ -->
<div id="s-scene-a" class="screen scene-screen off">
  <div class="thunder" id="thunder-a"></div>
  <div class="scene-rain" id="rain-sa"></div>
  <div class="scene-ground"></div>
  <div class="scene-label">A 상황</div>
  <div class="scene-back-hint">화면을 클릭하면 돌아갑니다</div>
</div>

<!-- ══════════════════════════════════
     SCREEN 7 · SCENE B
══════════════════════════════════ -->
<div id="s-scene-b" class="screen scene-screen off">
  <div class="thunder" id="thunder-b"></div>
  <div class="scene-rain" id="rain-sb"></div>
  <div class="scene-ground"></div>
  <div class="scene-label">B 상황</div>
  <div class="scene-back-hint">화면을 클릭하면 돌아갑니다</div>
</div>

<script>
  /* ── STATE ── */
  let current = 's-mario';
  let marioHits = 0;
  let marioLocked = false;
  const rainDone = {};

  /* ── TRANSITION ── */
  const overlay = document.getElementById('transition');

  function go(nextId, delay = 0) {
    setTimeout(() => {
      overlay.classList.add('fade-in');
      overlay.style.transition = 'opacity 0.3s ease';
      setTimeout(() => {
        showOnly(nextId);
        overlay.classList.remove('fade-in');
        overlay.style.transition = 'opacity 0.4s ease';
      }, 320);
    }, delay);
  }

  function showOnly(id) {
    document.querySelectorAll('.screen').forEach(s => {
      s.id === id ? s.classList.remove('off') : s.classList.add('off');
    });
    current = id;
    // Trigger rain for screens that need it
    const rainMap = {
      's-story1': 'rain-s1',
      's-story2': 'rain-s2',
      's-story3': 'rain-s3',
      's-scene-a': 'rain-sa',
      's-scene-b': 'rain-sb',
    };
    if (rainMap[id] && !rainDone[id]) {
      makeRain(rainMap[id], id.startsWith('s-scene'));
      rainDone[id] = true;
    }
    // Add puddles to scenes
    if ((id === 's-scene-a' || id === 's-scene-b') && !rainDone[id + '-puddles']) {
      makePuddles(id);
      rainDone[id + '-puddles'] = true;
    }
    // Thunder for scenes
    if (id === 's-scene-a' || id === 's-scene-b') {
      scheduleThunder(id === 's-scene-a' ? 'thunder-a' : 'thunder-b');
    }
  }

  /* ── RAIN GENERATOR ── */
  function makeRain(containerId, heavy) {
    const c = document.getElementById(containerId);
    const count = heavy ? 80 : 50;
    for (let i = 0; i < count; i++) {
      const d = document.createElement('div');
      const dur = 0.22 + Math.random() * (heavy ? 0.28 : 0.38);
      const h   = heavy ? (18 + Math.random() * 22) : (10 + Math.random() * 16);
      const op  = heavy ? (0.55 + Math.random() * 0.35) : (0.4 + Math.random() * 0.3);
      d.style.cssText = `
        position:absolute;
        left:${Math.random() * 100}%;
        width:${heavy ? 2 : 1.5}px;
        height:${h}px;
        background:rgba(150,200,255,${op});
        animation:rainFall ${dur}s linear infinite;
        animation-delay:${Math.random() * 1}s;
        transform:skewX(-8deg);
      `;
      c.appendChild(d);
    }
  }

  function makePuddles(screenId) {
    const scr = document.getElementById(screenId);
    const positions = [15, 32, 50, 68, 82];
    positions.forEach(pct => {
      const p = document.createElement('div');
      p.className = 'puddle';
      const w = 40 + Math.random() * 70;
      p.style.cssText = `left:${pct}%;width:${w}px;height:${8+Math.random()*8}px;transform:translateX(-50%);animation-delay:${Math.random()*2}s;`;
      scr.appendChild(p);
    });
  }

  /* ── THUNDER ── */
  function scheduleThunder(id) {
    const delay = 3000 + Math.random() * 5000;
    setTimeout(() => {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.add('flash');
      setTimeout(() => { el.classList.remove('flash'); scheduleThunder(id); }, 350);
    }, delay);
  }

  /* ── MARIO ── */
  function marioHit() {
    if (marioLocked || marioHits >= 3) return;
    marioLocked = true;
    marioHits++;

    // Jump animation
    const mario = document.getElementById('mario-char');
    mario.classList.add('mario-jump');

    // Brick bump
    const brickSvg = document.getElementById('brick-svg');
    brickSvg.classList.add('brick-bump');

    // Heart
    setTimeout(spawnHeart, 210);

    // Update counter
    document.getElementById('hit-ctr').textContent = `💗 ${marioHits} / 3`;

    setTimeout(() => {
      mario.classList.remove('mario-jump');
      brickSvg.classList.remove('brick-bump');
      marioLocked = false;
      if (marioHits >= 3) go('s-story1', 700);
    }, 460);
  }

  function spawnHeart() {
    const wrap = document.getElementById('brick-wrap');
    const h = document.createElement('div');
    h.className = 'heart-pop';
    h.textContent = ['💗','💖','💕'][marioHits - 1];
    h.style.marginLeft = (Math.random() * 30 - 15) + 'px';
    wrap.appendChild(h);
    setTimeout(() => h.remove(), 1000);
  }

  /* ── CLICK HANDLER ── */
  document.getElementById('btn-a').addEventListener('click', e => { e.stopPropagation(); go('s-scene-a'); });
  document.getElementById('btn-b').addEventListener('click', e => { e.stopPropagation(); go('s-scene-b'); });

  document.addEventListener('click', () => {
    switch (current) {
      case 's-mario':   marioHit(); break;
      case 's-story1':  go('s-story2'); break;
      case 's-story2':  go('s-story3'); break;
      case 's-story3':  go('s-choice'); break;
      case 's-scene-a':
      case 's-scene-b': go('s-choice'); break;
    }
  });
</script>
</body>
</html>
